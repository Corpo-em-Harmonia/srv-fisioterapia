spring.application.name=fisioterapia

# Porta - Render injeta PORT automaticamente
server.port=${PORT:8080}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}

# Upload
server.tomcat.max-http-form-post-size=1MB
spring.servlet.multipart.max-request-size=2MB
spring.servlet.multipart.max-file-size=2MB

# JWT
auth.jwt.secret=${JWT_SECRET}
auth.jwt.expiration=28800

# Admin
auth.admin.email=${ADMIN_EMAIL}
auth.admin.password=${ADMIN_PASSWORD}

# Produção / proxy
app.security.trust-proxy=${TRUST_PROXY:false}
app.security.require-https=${REQUIRE_HTTPS:false}
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}