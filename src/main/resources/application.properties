spring.application.name=fisioterapia

# Front-end origins allowed for CORS (comma separated)
app.cors.allowed-origins=http://localhost:4200,http://localhost:3000

# Request size limits
server.tomcat.max-http-form-post-size=1MB
spring.servlet.multipart.max-request-size=2MB
spring.servlet.multipart.max-file-size=2MB

# JWT — em producao defina JWT_SECRET via variavel de ambiente (minimo 32 chars)
auth.jwt.secret=${JWT_SECRET:dev-only-secret-not-for-production-use}
auth.jwt.expiration=28800

# Admin bootstrap — em producao defina ADMIN_EMAIL e ADMIN_PASSWORD via variavel de ambiente
auth.admin.email=${ADMIN_EMAIL:admin@clinica.com}
auth.admin.password=${ADMIN_PASSWORD:}

# Seguranca — habilitar apenas se houver reverse proxy (nginx/cloudflare) na frente
app.security.trust-proxy=false
